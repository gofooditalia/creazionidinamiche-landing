<style>
  :root{
    --bg:#0d1d36; --ink:#a9bdcb; --mute:#7c95a7; --deep:#2a4d80;
    --paint:2.4s;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Space Grotesk",system-ui,sans-serif;
    display:flex; flex-direction:column; min-height:100svh;
    -webkit-font-smoothing:antialiased;
  }
  main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
       padding:48px 16px 32px;text-align:center;gap:clamp(20px,4vh,40px)}
  .mark{width:min(78vw,520px);height:auto;display:block;overflow:visible}
  .mark .brush{fill:var(--ink)}
  .mark .reveal{fill:none;stroke:#fff;stroke-width:150;stroke-linecap:round;stroke-linejoin:round;
       stroke-dasharray:1;stroke-dashoffset:1;animation:paint var(--paint) cubic-bezier(.55,.1,.35,1) .3s forwards}
  @keyframes paint{to{stroke-dashoffset:0}}

  .name{font-size:clamp(28px,6.4vw,64px);letter-spacing:-.01em;line-height:1;
        white-space:nowrap;min-height:1.2em;opacity:0;animation:fade .8s ease calc(var(--paint) + .2s) forwards}
  .name .a{font-weight:400;color:var(--mute)}
  .name .b{font-weight:700;color:var(--ink)}
  .name .l{display:inline-block}
  .name .v{max-width:.75em;overflow:hidden;vertical-align:bottom;
           transition:max-width .7s cubic-bezier(.6,0,.3,1),opacity .5s ease;
           transition-delay:calc(var(--i) * 70ms)}
  .name.sigla .v{max-width:0;opacity:0}
  .name.sigla .l:not(.v){letter-spacing:.06em}
  .name .l:not(.v){transition:letter-spacing .7s cubic-bezier(.6,0,.3,1)}

  .status{opacity:0;animation:fade .8s ease calc(var(--paint) + .8s) forwards;display:flex;flex-direction:column;gap:14px;align-items:center}
  .badge{font-size:13px;font-weight:500;letter-spacing:.18em;text-transform:uppercase;color:var(--mute);
         border:1px solid rgba(124,149,167,.35);border-radius:999px;padding:7px 14px;display:inline-flex;gap:10px;align-items:center}
  .badge i{width:7px;height:7px;border-radius:50%;background:var(--ink);animation:pulse 2s ease-in-out infinite}
  .claim{font-size:clamp(16px,2.2vw,20px);color:var(--ink);max-width:34ch;line-height:1.45}
  .claim em{font-style:normal;color:var(--mute)}
  .contact{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:6px}
  .contact a{color:var(--bg);background:var(--ink);text-decoration:none;font-weight:500;font-size:15px;
             padding:11px 18px;border-radius:999px;transition:transform .2s ease,background .2s ease}
  .contact a.ghost{background:transparent;color:var(--ink);border:1px solid rgba(169,189,203,.45)}
  .contact a:hover{transform:translateY(-1px)}
  .contact a:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
  footer{padding:20px 16px 28px;text-align:center;font-size:13px;color:var(--mute);opacity:.8}
  @keyframes fade{to{opacity:1}}
  @keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}

  @media (prefers-reduced-motion: reduce){
    .mark .reveal{animation:none;stroke-dashoffset:0}
    .name,.status{animation:none;opacity:1}
    .name .v,.name .l{transition:none}
    .badge i{animation:none}
  }
</style>
